name: WorkBuddy Auto Sign-in

on:
  schedule:
    # GitHub cron 使用 UTC；16:17 UTC = 北京时间次日 00:17。
    # 避开整点高峰，降低定时任务延迟或被丢弃的概率。
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: 执行模式
        required: true
        default: auto
        type: choice
        options:
          - auto
          - status
          - growth

permissions:
  contents: read

concurrency:
  group: workbuddy-auto-signin
  cancel-in-progress: false

jobs:
  signin:
    name: ${{ matrix.label }}${{ matrix.uid && format('（uid {0}）', matrix.uid) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 一个账号失败不影响其他账号继续跑。
      fail-fast: false
      # 串行执行，避免同一时刻对同一接口发起并发请求。
      max-parallel: 1
      matrix:
        include:
          # 每个账号对应一个仓库 Secret。槽位没有配置 Secret 时会自动跳过，
          # 不会让工作流失败；新增账号只需建好 Secret，不必改这里。
          #
          # uid 走仓库变量（Settings → Secrets and variables → Actions → Variables），
          # 不写死在文件里 —— 这是公开仓库，避免把账号标识随代码公开。
          # 建好变量后任务名会显示成 "账号 2（uid xxxx）"，便于在 Actions 列表里辨认。
          - label: "账号 1"
            secret_name: WORKBUDDY_AUTH_JSON
            uid: ${{ vars.WB_ACCOUNT_UID }}
          - label: "账号 2"
            secret_name: WORKBUDDY_AUTH_JSON_2
            uid: ${{ vars.WB_ACCOUNT_UID_2 }}
          - label: "账号 3"
            secret_name: WORKBUDDY_AUTH_JSON_3
            uid: ${{ vars.WB_ACCOUNT_UID_3 }}
          - label: "账号 4"
            secret_name: WORKBUDDY_AUTH_JSON_4
            uid: ${{ vars.WB_ACCOUNT_UID_4 }}

    env:
      WORKBUDDY_BUDGET_SECONDS: "420"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare WorkBuddy credentials
        id: prep
        env:
          WORKBUDDY_AUTH_JSON: ${{ secrets[matrix.secret_name] }}
          WORKBUDDY_AUTH_FILE: ${{ runner.temp }}/wb-auth-${{ matrix.secret_name }}.json
          MATRIX_SECRET: ${{ matrix.secret_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("WORKBUDDY_AUTH_JSON", "").strip()
          out = Path(os.environ["GITHUB_OUTPUT"])

          if not raw:
              # 该槽位未配置 Secret —— 跳过，不算失败。
              with out.open("a", encoding="utf-8") as fh:
                  fh.write("available=false\n")
              print("跳过：未配置 Secret %s" % os.environ.get("MATRIX_SECRET", ""))
              raise SystemExit(0)

          try:
              session = json.loads(raw)
          except json.JSONDecodeError:
              raise SystemExit("WORKBUDDY_AUTH_JSON 不是合法 JSON，请重新保存完整的凭据文件内容。")

          if not isinstance(session, dict):
              raise SystemExit("WORKBUDDY_AUTH_JSON 的顶层必须是 JSON 对象。")

          token = (session.get("auth") or {}).get("accessToken")
          uid = (session.get("account") or {}).get("uid")
          if not isinstance(token, str) or not token:
              raise SystemExit(
                  "WORKBUDDY_AUTH_JSON 里的 auth.accessToken 不是明文字符串。"
                  "新版桌面端写出的凭据文件是加密信封（$wbEncrypted），"
                  "请改用明文凭据（例如仍在用明文格式的桌面端，或未启用字段加密的客户端）。"
              )
          if not uid:
              raise SystemExit("WORKBUDDY_AUTH_JSON 缺少 account.uid。")

          # Secret 的整体会被 GitHub 脱敏；额外屏蔽 token，防止异常栈只输出其中一部分。
          print("::add-mask::%s" % token)
          auth_file = Path(os.environ["WORKBUDDY_AUTH_FILE"])
          auth_file.write_text(json.dumps(session, ensure_ascii=False), encoding="utf-8")
          auth_file.chmod(0o600)

          with out.open("a", encoding="utf-8") as fh:
              fh.write("available=true\n")
          PY

      - name: Identify account
        if: ${{ steps.prep.outputs.available == 'true' }}
        env:
          WORKBUDDY_AUTH_FILE: ${{ runner.temp }}/wb-auth-${{ matrix.secret_name }}.json
          SLOT_LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          session = json.loads(Path(os.environ["WORKBUDDY_AUTH_FILE"]).read_text(encoding="utf-8"))
          account = session.get("account") or {}
          auth = session.get("auth") or {}
          uid = account.get("uid") or "未知"
          domain = auth.get("domain") or "未知"

          # 只输出 uid 与域名：昵称/uin 属于个人信息，不写进运行摘要。
          line = "- **%s** — uid `%s` · domain `%s`" % (os.environ.get("SLOT_LABEL", ""), uid, domain)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as fh:
              fh.write(line + "\n")

          if os.environ.get("SLOT_LABEL"):
              line_label = os.environ["SLOT_LABEL"]
          else:
              line_label = os.environ.get("MATRIX_SECRET", "")
          print("本次运行的账号：%s | uid=%s | domain=%s" % (line_label, uid, domain))
          PY

      - name: Run WorkBuddy sign-in
        if: ${{ steps.prep.outputs.available == 'true' }}
        env:
          ACTION: ${{ github.event.inputs.action || 'auto' }}
          WORKBUDDY_AUTH_FILE: ${{ runner.temp }}/wb-auth-${{ matrix.secret_name }}.json
        run: python signin.py "$ACTION"

      - name: Remove credentials
        if: ${{ always() }}
        env:
          WORKBUDDY_AUTH_FILE: ${{ runner.temp }}/wb-auth-${{ matrix.secret_name }}.json
        run: rm -f -- "$WORKBUDDY_AUTH_FILE"
